{% extends 'base.html' %}

{% block content %}
<section class="login-section">
    <div class="container">
        <div class="login-card">
            <div class="login-card-left">
                <h2>Welcome Back</h2>
                <p>Sign in to access fresh produce from local farmers.</p>
                <div class="illustration"><i class="fas fa-leaf"></i></div>
            </div>
            <div class="login-card-right">

<form method="post" class="login-form">
    {% csrf_token %}
    <h3>Sign in to your account</h3>
    {% if form.errors %}
    <div style='color: red; margin-bottom: 1rem;'>
        Please enter a correct username and password.
    </div>
    {% endif %}
    
    <div class="input-group">
        <span class="input-icon"><i class="fas fa-user"></i></span>
        <input type="text" name="username" placeholder="Username" required>
    </div>
    
    <div class="input-group">
        <span class="input-icon"><i class="fas fa-lock"></i></span>
        <input type="password" name="password" placeholder="Password" required>
    </div>
    
    <div class="form-row">
        <label class="checkbox"><input type="checkbox" name="remember"> Remember me</label>
        <a class="forgot" href="#">Forgot?</a>
    </div>

    <input type="hidden" name="next" value="{% url 'homepage' %}">

    <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Sign In</button>

    <div class="divider"><span>or</span></div>

    <div class="socials">
        <button type="button" class="btn btn-outline"><i class="fab fa-google"></i> Google</button>
        <button type="button" class="btn btn-outline"><i class="fab fa-facebook-f"></i> Facebook</button>
    </div>

    <p class="register">Don't have an account? <a href="{% url 'register' %}">Create one</a></p>
</form>

</div>
        </div>
    </div>
</section>
{% endblock %}
